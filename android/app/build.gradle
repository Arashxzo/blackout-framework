plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// ============================================================
// Read local configuration from `android/local.properties`
// This file is GITIGNORED. It must contain:
//     BACKEND_URL=https://your-worker.workers.dev
// See `local.properties.example` for a template.
// ============================================================
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def backendUrl = localProperties.getProperty('BACKEND_URL') ?: 'https://configure-me.workers.dev'

android {
    namespace 'com.arashxzo.blackout'
    compileSdk 35

    defaultConfig {
        applicationId "com.arashxzo.blackout"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "1.0"

        // Inject BACKEND_URL into BuildConfig
        buildConfigField "String", "BACKEND_URL", "\"${backendUrl}\""
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true   // ← enable BuildConfig generation
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'androidx.activity:activity-compose:1.9.0'

    // Jetpack Compose BOM
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    // For storing history
    implementation 'com.google.code.gson:gson:2.10.1'

    // For communicating with the Cloudflare server (credits system)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}